version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: reachinbox_redis
    ports:
      - "6379:6379"
    restart: always
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  postgres:
    image: postgres:15-alpine
    container_name: reachinbox_postgres
    environment:
      POSTGRES_USER: reachinbox_user
      POSTGRES_PASSWORD: reachinbox_secure_password
      POSTGRES_DB: reachinbox_db
    ports:
      - "5432:5432"
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  redis_data:
  postgres_data:
